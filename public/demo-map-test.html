<!DOCTYPE html>
<html>
<head>
    <title>Public Map ID Test</title>
    <style>
        #map {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        let map;

        function initMap() {
            console.log("initMap called for public DEMO_MAP_ID...");
            map = new google.maps.Map(document.getElementById('map'), {
                center: {lat: -34.397, lng: 150.644},
                zoom: 8,
                mapId: 'DEMO_MAP_ID' // Using Google's public demo Map ID
            });
            console.log("Map object created with DEMO_MAP_ID:", map);

            new google.maps.Marker({
                position: {lat: -34.397, lng: 150.644},
                map: map,
                title: "Test Marker"
            });
            console.log("Test marker added to DEMO_MAP_ID map.");
        }
    </script>
    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY_HERE&callback=initMap&v=beta&map_ids=DEMO_MAP_ID">
    </script>
</body>
</html>
